<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Cleaner</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060d;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;
    overflow:hidden;color:#fff;transform-origin:50% 50%;
    background:radial-gradient(120% 70% at 50% 0%,#2a1440 0%,#120b24 45%,#070812 100%)}
  .stage.clean{background:radial-gradient(120% 70% at 50% 0%,#0f3b3a 0%,#0b1d2a 45%,#070812 100%)}
  .bgfade{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,#0f3b3a 0%,#0b1d2a 45%,#070812 100%);opacity:0;transition:opacity 1.2s}
  .bgfade.on{opacity:1}

  .title{position:absolute;top:90px;left:0;right:0;text-align:center;font-size:62px;font-weight:800;letter-spacing:1px}
  .subtitle{position:absolute;top:172px;left:0;right:0;text-align:center;font-size:32px;color:#b9b3d6;font-weight:500}

  /* Gauge */
  .gauge{position:absolute;left:250px;top:250px;width:580px;height:580px}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .gauge .track{stroke:rgba(255,255,255,.08)}
  .gauge .val{stroke:var(--gc,#ff3b5c);transition:stroke .4s;filter:drop-shadow(0 0 18px var(--gc,#ff3b5c))}
  .gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pct{font-size:150px;font-weight:900;line-height:1;color:var(--gc,#ff3b5c);transition:color .4s}
  .pct small{font-size:70px}
  .gb{font-size:38px;color:#d8d3ee;margin-top:14px;font-weight:600}
  .warn{position:absolute;top:860px;left:0;right:0;text-align:center;font-size:42px;font-weight:800;color:#ff4d6d;
    animation:blink 1s infinite}
  .warn.ok{color:#2ee6a6;animation:none}
  @keyframes blink{50%{opacity:.35}}
  .gauge.shake{animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* Rows */
  .row{position:absolute;left:70px;width:940px;height:140px;border-radius:34px;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08)}
  .ico{position:absolute;left:22px;top:20px;width:100px;height:100px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:58px}
  .name{position:absolute;left:150px;top:22px;font-size:40px;font-weight:700}
  .size{position:absolute;right:30px;top:24px;font-size:36px;font-weight:700;color:#e9e4ff}
  .bar{position:absolute;left:150px;right:30px;top:88px;height:26px;border-radius:13px;background:rgba(255,255,255,.1);overflow:hidden}
  .fill{height:100%;border-radius:13px;width:0%;transition:width 1.4s cubic-bezier(.3,.7,.2,1),background .6s}
  .row.ok .fill{background:linear-gradient(90deg,#16c79a,#2ee6a6)!important}

  /* Button */
  .btn{position:absolute;left:110px;top:1625px;width:860px;height:170px;border-radius:85px;
    background:linear-gradient(90deg,#00c6ff,#7b2ff7);display:flex;align-items:center;justify-content:center;
    font-size:58px;font-weight:900;letter-spacing:4px;box-shadow:0 20px 60px rgba(123,47,247,.55);z-index:5;overflow:hidden;
    transition:transform .15s}
  .btn.pulse{animation:bp 1.1s infinite}
  @keyframes bp{50%{box-shadow:0 20px 90px rgba(0,198,255,.9);transform:scale(1.03)}}
  .btn.pressed{transform:scale(.94)!important;animation:none}
  .btn.busy{background:linear-gradient(90deg,#16c79a,#00c6ff)}
  .ripple{position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.75);
    transform:translate(-50%,-50%) scale(.2);animation:rip .7s ease-out forwards;pointer-events:none;z-index:6}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(6);opacity:0}}

  /* Crying emojis */
  .cry{position:absolute;font-size:120px;z-index:4;transform:translate(-50%,-50%) scale(0);
    animation:popin .5s cubic-bezier(.3,1.6,.5,1) forwards, wob 1.2s ease-in-out .5s infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
  @keyframes popin{to{transform:translate(-50%,-50%) scale(1)}}
  @keyframes wob{0%,100%{rotate:-8deg}50%{rotate:8deg}}
  .tear{position:absolute;width:16px;height:22px;background:#5ec8ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;z-index:4;
    animation:drop 1s ease-in infinite;opacity:.9}
  @keyframes drop{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(90px);opacity:0}}
  .swept{transition:transform .6s ease-in,opacity .6s;opacity:0!important}

  /* Broom */
  .broom{position:absolute;left:0;top:0;font-size:300px;z-index:7;opacity:0;pointer-events:none;
    filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
  .dust{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,210,190,.9),rgba(200,190,170,0));z-index:6;pointer-events:none;
    animation:puff .9s ease-out forwards}
  @keyframes puff{to{transform:scale(2.6) translateY(-40px);opacity:0}}
  .spark{position:absolute;font-size:60px;z-index:6;animation:sp 1s ease-out forwards;pointer-events:none}
  @keyframes sp{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.2) rotate(90deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}

  /* Hand */
  .hand{position:absolute;left:0;top:0;width:260px;z-index:9;transform:translate(1100px,2000px);
    transition:transform .9s cubic-bezier(.45,.05,.3,1);filter:drop-shadow(0 25px 30px rgba(0,0,0,.55))}
  .hand img{width:100%;display:block;transform-origin:15% 0%;transition:transform .15s}
  .hand.press img{transform:scale(.88)}

  /* Final sticker */
  .final{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,10,20,.0);backdrop-filter:blur(0px);opacity:0;pointer-events:none;transition:all .5s}
  .final.show{opacity:1;background:rgba(5,10,20,.55);backdrop-filter:blur(10px)}
  .thumb{font-size:430px;line-height:1;transform:scale(0) rotate(-30deg);
    filter:drop-shadow(0 0 0 #fff) drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(0 30px 40px rgba(0,0,0,.6))}
  .final.show .thumb{animation:stick .8s cubic-bezier(.3,1.7,.5,1) forwards, bob 1.4s ease-in-out .8s infinite}
  @keyframes stick{to{transform:scale(1) rotate(-8deg)}}
  @keyframes bob{0%,100%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.07) rotate(4deg)}}
  .ftext{margin-top:60px;font-size:78px;font-weight:900;text-align:center;opacity:0;transform:translateY(40px);transition:all .5s .4s}
  .fsub{margin-top:18px;font-size:46px;font-weight:700;color:#2ee6a6;opacity:0;transform:translateY(40px);transition:all .5s .6s}
  .final.show .ftext,.final.show .fsub{opacity:1;transform:none}
</style>
</head>

<div class="stage" id="stage">

  <div class="title">Phone Storage</div>

  <div class="final" id="final">
    <div class="thumb">👍</div>
    <div class="ftext">Memory cleaned!</div>
    <div class="fsub" id="freed">+48.6 GB free</div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const stage=$('stage'), ring=$('ring'), hand=$('hand'), btn=$('btn'), broom=$('broom'), finalEl=$('final');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const CIRC = 540.35, TOTAL = 64;

const CATS = [
  {name:'Photo Library', ico:'🖼️', bg:'linear-gradient(135deg,#ff5f6d,#ffc371)', fill:'linear-gradient(90deg,#ff3b5c,#ff7a59)', gb:24.8, after:4.1},
  {name:'Files',         ico:'📁', bg:'linear-gradient(135deg,#4facfe,#00f2fe)', fill:'linear-gradient(90deg,#ff7a1a,#ffb21a)', gb:15.6, after:3.2},
  {name:'Cookies',       ico:'🍪', bg:'linear-gradient(135deg,#f7b733,#fc4a1a)', fill:'linear-gradient(90deg,#ffb21a,#ffe14d)', gb:7.4,  after:0.2},
  {name:'Apps',          ico:'📱', bg:'linear-gradient(135deg,#a18cd1,#7b2ff7)', fill:'linear-gradient(90deg,#c04dff,#7b2ff7)', gb:14.3, after:6.0},
];
const ROW_Y0 = 960, ROW_H = 160;
const rowsEl = $('rows');
CATS.forEach((c,i)=>{
  const r=document.createElement('div'); r.className='row'; r.style.top=(ROW_Y0+i*ROW_H)+'px';
  r.innerHTML=`<div class="ico" style="background:${c.bg}">${c.ico}</div><div class="name">${c.name}</div>
    <div class="size">0 GB</div><div class="bar"><div class="fill" style="background:${c.fill}"></div></div>`;
  rowsEl.appendChild(r); c.el=r; c.fillEl=r.querySelector('.fill'); c.sizeEl=r.querySelector('.size');
});

function setGauge(p){
  ring.style.strokeDashoffset = CIRC*(1-p/100);
  $('pct').textContent = Math.round(p);
  $('gb').textContent = (TOTAL*p/100).toFixed(1)+' GB / '+TOTAL+' GB';
  const col = p>80 ? '#ff3b5c' : p>50 ? '#ffb21a' : '#2ee6a6';
  $('gauge').style.setProperty('--gc', col);
}
function tween(from,to,ms,fn,ease=t=>1-Math.pow(1-t,3)){
  return new Promise(res=>{const t0=performance.now();
    (function f(now){const t=Math.min(1,(now-t0)/ms);fn(from+(to-from)*ease(t));t<1?requestAnimationFrame(f):res();})(t0);});
}
function setRow(c,gb){ c.fillEl.style.width=(gb/TOTAL*100*2.2)+'%'; }  // ×2.2 so bars read visibly
function countRow(c,from,to,ms){ return tween(from,to,ms,v=>c.sizeEl.textContent=v.toFixed(1)+' GB'); }

// hand: fingertip offset inside the 260px-wide image
const HOT={x:39,y:6};
function handTo(x,y,instant){
  if(instant){hand.style.transition='none';}
  hand.style.transform=`translate(${x-HOT.x}px,${y-HOT.y}px)`;
  if(instant){void hand.offsetWidth;hand.style.transition='';}
}

let cries=[];
function spawnCry(x,y,delay){
  const faces=['😭','😢','😥','😭','😰'];
  const e=document.createElement('div'); e.className='cry';
  e.textContent=faces[Math.floor(Math.random()*faces.length)];
  e.style.left=x+'px'; e.style.top=y+'px'; e.style.animationDelay=`${delay}ms, ${delay+500}ms`;
  e.style.fontSize=(95+Math.random()*50)+'px';
  stage.appendChild(e); cries.push(e);
  [-26,26].forEach((dx,k)=>{const t=document.createElement('div');t.className='tear';
    t.style.left=(x+dx-8)+'px';t.style.top=(y+20)+'px';t.style.animationDelay=(delay+300+k*400)+'ms';
    stage.appendChild(t);cries.push(t);});
}
function dust(x,y){
  const d=document.createElement('div'); d.className='dust'; const s=40+Math.random()*60;
  d.style.width=d.style.height=s+'px'; d.style.left=(x-s/2+Math.random()*60-30)+'px'; d.style.top=(y-s/2+Math.random()*40)+'px';
  stage.appendChild(d); setTimeout(()=>d.remove(),950);
}
function spark(x,y){
  const s=document.createElement('div'); s.className='spark'; s.textContent=Math.random()<.5?'✨':'⭐';
  s.style.left=(x-30)+'px'; s.style.top=(y-30)+'px'; stage.appendChild(s); setTimeout(()=>s.remove(),1000);
}

// broom sweeps along a path of [x,y] points
async function sweep(points,msPerSeg){
  broom.style.opacity=1;
  for(let i=0;i<points.length-1;i++){
    const [x0,y0]=points[i],[x1,y1]=points[i+1];
    const dir = x1>=x0 ? 1 : -1;
    await tween(0,1,msPerSeg,t=>{
      const x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
      const wig=Math.sin(t*Math.PI*6)*14;
      broom.style.transform=`translate(${x-150}px,${y-230}px) scaleX(${-dir}) rotate(${wig}deg)`;
      if(Math.random()<.45) dust(x+dir*-40,y+40);
      // sweep away crying faces near the broom
      cries.forEach(c=>{ if(c.classList.contains('swept')) return;
        const cx=parseFloat(c.style.left), cy=parseFloat(c.style.top);
        if(Math.abs(cx-x)<130 && Math.abs(cy-y)<170){c.classList.add('swept');c.style.transform=`translate(${dir*500}px,-120px) rotate(${dir*180}deg) scale(.3)`;}
      });
    },t=>t);
  }
  broom.style.transition='opacity .4s'; broom.style.opacity=0; await sleep(400); broom.style.transition='';
}

async function run(){
  // reset
  cries.forEach(c=>c.remove()); cries=[];
  finalEl.classList.remove('show'); $('bgfade').classList.remove('on');
  btn.className='btn'; btn.textContent='OPTIMIZATION';
  $('warn').className='warn'; $('warn').textContent='⚠ Storage almost full!'; $('warn').style.opacity=0;
  $('sub').textContent='Scanning device…'; $('gauge').classList.remove('shake');
  CATS.forEach(c=>{c.el.classList.remove('ok'); c.fillEl.style.transition='none'; c.fillEl.style.width='0%'; c.sizeEl.textContent='0 GB'; void c.fillEl.offsetWidth; c.fillEl.style.transition='';});
  setGauge(0); handTo(1150,2100,true);
  await sleep(300);

  // 1) memory fills up
  const used = CATS.reduce((s,c)=>s+c.gb,0);           // 62.1 GB
  tween(0,used/TOTAL*100,1600,setGauge);
  for(const c of CATS){ setRow(c,c.gb); countRow(c,0,c.gb,1300); await sleep(200); }
  await sleep(1300);
  $('warn').style.opacity=''; $('sub').textContent='Your memory is clogged!';
  $('gauge').classList.add('shake');

  // 2) crying emojis appear after a couple of seconds
  await sleep(1800);
  const spots=[[170,330],[910,300],[150,760],[930,720],[540,885],[860,1040],[620,1200],[880,1360],[700,1510],[250,1110],[400,1420],[540,190]];
  spots.forEach(([x,y],i)=>spawnCry(x+(Math.random()*40-20),y+(Math.random()*30-15),i*140));
  await sleep(2600);

  // 3) hand enters and presses OPTIMIZATION
  btn.classList.add('pulse');
  handTo(560,1715);
  await sleep(1100);
  hand.classList.add('press'); btn.classList.add('pressed');
  const rp=document.createElement('div'); rp.className='ripple'; rp.style.left='450px'; rp.style.top='85px'; btn.appendChild(rp);
  await sleep(220);
  hand.classList.remove('press'); btn.classList.remove('pressed','pulse');
  btn.classList.add('busy'); btn.textContent='CLEANING…';
  $('gauge').classList.remove('shake'); $('sub').textContent='Optimizing memory…';
  await sleep(250);
  handTo(1150,2100);
  setTimeout(()=>rp.remove(),700);

  // 4) broom sweeps memory clean
  const cleanPct = CATS.reduce((s,c)=>s+c.after,0)/TOTAL*100;
  tween(used/TOTAL*100, cleanPct, 4200, setGauge, t=>t);
  CATS.forEach((c,i)=>setTimeout(()=>{ c.fillEl.style.transition='width 1.6s ease, background .6s'; setRow(c,c.after); c.el.classList.add('ok'); countRow(c,c.gb,c.after,1500); for(let k=0;k<4;k++) setTimeout(()=>spark(200+Math.random()*700,ROW_Y0+i*ROW_H+Math.random()*120),k*200); }, 1500+i*650));
  setTimeout(()=>{$('warn').className='warn ok'; $('warn').textContent='✓ Plenty of space';},3600);
  $('bgfade').classList.add('on');
  await sweep([[-150,560],[1230,420],[-150,860],[1230,1080],[-150,1300],[1230,1560]], 760);
  await sleep(300);
  btn.classList.remove('busy'); btn.textContent='OPTIMIZED ✓'; $('sub').textContent='All clean!';
  cries.forEach(c=>c.classList.add('swept'));

  // 5) thumbs-up sticker
  await sleep(500);
  $('freed').textContent='+'+(used-CATS.reduce((s,c)=>s+c.after,0)).toFixed(1)+' GB free';
  finalEl.classList.add('show');
  for(let k=0;k<10;k++) setTimeout(()=>spark(200+Math.random()*680,500+Math.random()*700),k*120);
  await sleep(3400);
  finalEl.classList.remove('show');
  await sleep(500);
  run();
}

function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit(); run();
</script>
